# MySQL local pour le développement : docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: whichdoor
      MYSQL_USER: whichdoor
      MYSQL_PASSWORD: whichdoor
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-dev:/var/lib/mysql

volumes:
  db-dev:
